<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{escaped_title} - Chọn CTV</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card: #1e293b;
            --card-border: #334155;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
        }
        .landing-card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 28px 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .badge-brand {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.35rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        p.desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .form-section {
            text-align: left;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px 16px;
            margin-bottom: 22px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 8px;
        }
        select {
            width: 100%;
            background: #1e293b;
            color: #f8fafc;
            border: 1.5px solid #475569;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.15s ease;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2212%22%20height%3D%2212%22%20viewBox%3D%220%200%2012%2012%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M2%204l4%204%204-4z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 14px center;
        }
        select:focus {
            border-color: var(--accent);
        }
        .btn-open {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.15s ease;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
        }
        .btn-open:hover {
            filter: brightness(1.1);
        }
        .btn-open:active {
            transform: scale(0.98);
        }
        .footer-note {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 18px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="landing-card">
        <div class="badge-brand">Trust Bridge SSOT</div>
        <h1>{escaped_title}</h1>
        <p class="desc">{escaped_desc}</p>
        
        <div class="form-section">
            <label for="ctvSelect">Cộng Tác Viên (CTV) Phụ Trách</label>
            <select id="ctvSelect" onchange="updateCtvButtonState()">
                {options_html}
            </select>
        </div>
        <div id="ctvGpsPill" style="display:inline-flex; align-items:center; gap:6px; font-size:0.75rem; color:#94a3b8; background:rgba(30,41,59,0.8); border:1px solid #334155; padding:6px 12px; border-radius:8px; margin: 12px 0 16px 0;">
            <svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:currentColor;"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5 2.5-2.5 2.5z"/></svg>
            <span id="txtCtvGps">Đang xác thực vị trí đối soát...</span>
        </div>
        
        <button type="button" class="btn-open" id="btnOpenForm" onclick="openSelectedCtvForm()" disabled style="opacity:0.45; cursor:not-allowed; background:#334155; box-shadow:none;">
            <span>Mở Biểu Mẫu Khảo Sát</span>
            <span>&rarr;</span>
        </button>
        <p id="btnHelperText" style="font-size:0.78rem; color:#f59e0b; margin-top:8px; font-weight:600;">Vui lòng chọn Cộng tác viên (CTV) phụ trách để tiếp tục</p>
        <p class="footer-note">Liên kết khảo sát sẽ tự động gắn mã CTV phụ trách để đảm bảo quyền lợi đối soát và thù lao.</p>
    </div>

    <script>
        let earlyGps = null;
        let gpsDone = false;

        function applyGpsFallback() {
            if (gpsDone) return;
            gpsDone = true;
            earlyGps = { lat: 21.0285, lon: 105.8542, acc: 5000, fallback: true };
            try {
                sessionStorage.setItem("survey_gps_lat", earlyGps.lat);
                sessionStorage.setItem("survey_gps_lon", earlyGps.lon);
                sessionStorage.setItem("survey_gps_acc", earlyGps.acc);
            } catch (e) {}
            const el = document.getElementById("txtCtvGps");
            const pill = document.getElementById("ctvGpsPill");
            if (el) el.textContent = "Đã dùng vị trí mạng (IP dự phòng)";
            if (pill) {
                pill.style.borderColor = "#38bdf8";
                pill.style.color = "#38bdf8";
                pill.style.background = "rgba(56, 189, 248, 0.15)";
            }
        }

        function resolveEarlyLocation() {
            // Strict 3.0s timeout fallback guard so it NEVER hangs
            const fallbackTimer = setTimeout(applyGpsFallback, 3000);

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        clearTimeout(fallbackTimer);
                        if (gpsDone) return;
                        gpsDone = true;
                        earlyGps = {
                            lat: pos.coords.latitude,
                            lon: pos.coords.longitude,
                            acc: pos.coords.accuracy || 15
                        };
                        try {
                            sessionStorage.setItem("survey_gps_lat", earlyGps.lat);
                            sessionStorage.setItem("survey_gps_lon", earlyGps.lon);
                            sessionStorage.setItem("survey_gps_acc", earlyGps.acc);
                        } catch (e) {}
                        const el = document.getElementById("txtCtvGps");
                        const pill = document.getElementById("ctvGpsPill");
                        if (el) el.textContent = `Đã xác thực vị trí GPS (${earlyGps.lat.toFixed(4)}, ${earlyGps.lon.toFixed(4)})`;
                        if (pill) {
                            pill.style.borderColor = "#10b981";
                            pill.style.color = "#10b981";
                            pill.style.background = "rgba(16, 185, 129, 0.15)";
                        }
                    },
                    (err) => {
                        clearTimeout(fallbackTimer);
                        applyGpsFallback();
                    },
                    { enableHighAccuracy: false, timeout: 2500, maximumAge: 60000 }
                );
            } else {
                clearTimeout(fallbackTimer);
                applyGpsFallback();
            }
        }
        document.addEventListener("DOMContentLoaded", resolveEarlyLocation);

        function updateCtvButtonState() {
            const sel = document.getElementById("ctvSelect");
            const btn = document.getElementById("btnOpenForm");
            const helper = document.getElementById("btnHelperText");
            const ctv = sel ? sel.value.trim() : "";

            if (!ctv) {
                btn.disabled = true;
                btn.style.opacity = "0.45";
                btn.style.cursor = "not-allowed";
                btn.style.background = "#334155";
                btn.style.boxShadow = "none";
                if (helper) {
                    helper.textContent = "Vui lòng chọn Cộng tác viên (CTV) phụ trách để tiếp tục";
                    helper.style.color = "#f59e0b";
                }
            } else {
                btn.disabled = false;
                btn.style.opacity = "1";
                btn.style.cursor = "pointer";
                btn.style.background = "linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%)";
                btn.style.boxShadow = "0 4px 14px rgba(2, 132, 199, 0.35)";
                if (helper) {
                    helper.textContent = `✓ Sẵn sàng mở khảo sát với mã ${ctv}`;
                    helper.style.color = "#10b981";
                }
            }
        }

        function openSelectedCtvForm() {
            const sel = document.getElementById("ctvSelect");
            const ctv = sel ? sel.value.trim() : "";
            if (!ctv) {
                alert("Vui lòng chọn Cộng tác viên (CTV) trong danh sách để mở biểu mẫu!");
                sel.focus();
                return;
            }
            const params = new URLSearchParams(window.location.search);
            params.set("ref", ctv);
            if (earlyGps) {
                params.set("lat", earlyGps.lat);
                params.set("lon", earlyGps.lon);
                params.set("acc", earlyGps.acc);
            }
            const targetPath = window.location.pathname.startsWith("/forms/")
                ? window.location.pathname
                : "/forms/" + encodeURIComponent("{form_id}");
            window.location.href = targetPath + "?" + params.toString();
        }
</html>
