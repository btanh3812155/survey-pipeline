name: Pipeline CI/CD

on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master
  # Deployments are manual until Wave 7 protects mutable storage and the
  # production cutover checks are implemented.
  workflow_dispatch:

jobs:
  test:
    name: Automated Pytest Suite & Architecture Gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_ci_cd_32_bytes_long_here
          # Unit tests must mock persistence. Real PostgreSQL behavior is gated
          # in postgres-harness below; do not advertise SQLite as PostgreSQL.
        run: |
          PYTHONPATH=. pytest tests/ -v --maxfail=5

      - name: Release Gate - Strip Placeholders Verification (Master only)
        if: github.ref == 'refs/heads/master'
        run: |
          chmod +x scripts/strip_dev_placeholders.sh
          ./scripts/strip_dev_placeholders.sh
          # Verify zero placeholder files exist
          if ls data/forms/placeholder_*.json 1> /dev/null 2>&1; then
            echo "[RELEASE GATE ERROR] Placeholder forms still detected on master!"
            exit 1
          fi
          echo "[RELEASE GATE PASSED] Production master is 100% free of placeholder forms."

  postgres-harness:
    name: Disposable PostgreSQL/pgvector Harness
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: survey_pipeline_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d survey_pipeline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run isolated PostgreSQL harness
        env:
          ENVIRONMENT: test
          UPGRADE_TEST_REQUIRE: "1"
          UPGRADE_TEST_DATABASE_URL: postgresql://postgres:test_only@127.0.0.1:55432/survey_pipeline_test
        run: |
          PYTHONPATH=. pytest -q -m postgres tests/test_postgres_harness.py tests/test_phone_links.py tests/test_h1_corrections.py tests/test_wave3_attempts.py tests/test_wave3_route.py tests/test_wave3_process_crash.py
          PYTHONPATH=. pytest -q -m 'not postgres' tests/test_h1_corrections.py
          PYTHONPATH=. pytest -q tests/test_postgres_runner.py

  deploy-staging:
    name: Deploy to Staging (Droplet /root/survey-pipeline-dev)
    needs: [test, postgres-harness]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Add Droplet Host Key to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 146.190.201.32 >> ~/.ssh/known_hosts

      - name: Deploy Code to Staging Directory
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '__pycache__' \
            --exclude '.venv' \
            --exclude 'archives/' \
            --exclude 'models/' \
            ./ root@146.190.201.32:/root/survey-pipeline-dev/

      - name: Restart Dev Staging Service
        run: |
          ssh root@146.190.201.32 "docker restart survey-dev-app-1"

      - name: Verify Staging Health Check
        run: |
          curl -sk --fail --connect-timeout 10 https://dev.146.190.201.32.sslip.io/health || \
          ssh root@146.190.201.32 "docker exec survey-dev-app-1 curl -sf http://127.0.0.1:8000/health"
          curl -sk --fail --connect-timeout 10 https://dev.146.190.201.32.sslip.io/ready || \
          ssh root@146.190.201.32 "docker exec survey-dev-app-1 curl -sf http://127.0.0.1:8000/ready"

  deploy-production:
    name: Zero-Downtime Deploy to Production (Droplet /root/survey-pipeline)
    needs: [test, postgres-harness]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Strip Dev Placeholders before Production Sync
        run: |
          chmod +x scripts/strip_dev_placeholders.sh
          ./scripts/strip_dev_placeholders.sh

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Add Droplet Host Key to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 146.190.201.32 >> ~/.ssh/known_hosts

      - name: Deploy Code to Production Directory
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '__pycache__' \
            --exclude '.venv' \
            --exclude 'archives/' \
            --exclude 'models/' \
            --exclude 'data/forms/placeholder_*.json' \
            ./ root@146.190.201.32:/root/survey-pipeline/

      - name: Restart Production Service
        run: |
          ssh root@146.190.201.32 "docker restart survey-pipeline-app-1"

      - name: Verify Production Health Check
        run: |
          curl -sf --connect-timeout 10 https://survey.trustbridgevn.com/health
          curl -sf --connect-timeout 10 https://survey.trustbridgevn.com/ready
