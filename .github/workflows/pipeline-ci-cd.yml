name: Pipeline CI/CD

on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master
  # Stage/production releases require a manual dispatch and environment approval.
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Permit pending migrations on the selected target after backup
        type: boolean
        default: false

jobs:
  test:
    name: Automated Pytest Suite & Architecture Gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: test
          MOCK_AI: "1"
          SECRET_KEY: test_secret_key_ci_cd_32_bytes_long_here
          # Unit tests must mock persistence. Real PostgreSQL behavior is gated
          # in postgres-harness below; do not advertise SQLite as PostgreSQL.
        run: |
          PYTHONPATH=. pytest tests/ -v --maxfail=5

      - name: Release Gate - Strip Placeholders Verification (Master only)
        if: github.ref == 'refs/heads/master'
        run: |
          chmod +x scripts/strip_dev_placeholders.sh
          ./scripts/strip_dev_placeholders.sh
          # Verify zero placeholder files exist
          if ls data/forms/placeholder_*.json 1> /dev/null 2>&1; then
            echo "[RELEASE GATE ERROR] Placeholder forms still detected on master!"
            exit 1
          fi
          echo "[RELEASE GATE PASSED] Production master is 100% free of placeholder forms."

  postgres-harness:
    name: Disposable PostgreSQL/pgvector Harness
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: survey_pipeline_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d survey_pipeline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run isolated PostgreSQL harness
        env:
          ENVIRONMENT: test
          MOCK_AI: "1"
          UPGRADE_TEST_REQUIRE: "1"
          UPGRADE_TEST_DATABASE_URL: postgresql://postgres:test_only@127.0.0.1:55432/survey_pipeline_test
        run: |
          PYTHONPATH=. pytest -q -m postgres tests/
          PYTHONPATH=. pytest -q -m 'not postgres' tests/test_h1_corrections.py
          PYTHONPATH=. pytest -q tests/test_postgres_runner.py
          PYTHONPATH=. pytest -q tests/test_outbox_notifications.py tests/test_outbox_exports.py tests/test_outbox_delivery.py -m 'not postgres'

  deploy:
    name: Guarded code release
    needs: [test, postgres-harness]
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master')
    environment: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Install pinned SSH host key
        env:
          PINNED_HOST_KEYS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          test -n "$PINNED_HOST_KEYS"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$PINNED_HOST_KEYS" > "$HOME/.ssh/known_hosts"

      - name: Run guarded schema, code and smoke release
        env:
          TARGET: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
          RELEASE_HOST: ${{ vars.RELEASE_HOST }}
          RELEASE_ROOT: ${{ vars.RELEASE_ROOT }}
          RELEASE_APP: ${{ vars.RELEASE_APP }}
          RELEASE_WORKER: ${{ vars.RELEASE_WORKER }}
          RELEASE_DB_CONTAINER: ${{ vars.RELEASE_DB_CONTAINER }}
          RELEASE_DB_NAME: ${{ vars.RELEASE_DB_NAME }}
          RELEASE_DB_USER: ${{ vars.RELEASE_DB_USER }}
          RELEASE_BUILD_ID: ${{ github.sha }}
        run: |
          args=(--target "$TARGET" --schema 002 --all-code)
          if [[ "$APPLY_MIGRATIONS" == true ]]; then args+=(--apply-migrations); fi
          bash scripts/deploy_prod.sh "${args[@]}"
