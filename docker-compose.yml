services:
  app-dev:
    container_name: survey-dev-app-1
    image: survey-pipeline-app-dev:latest
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://postgres:secret_password@postgres:5432/surveydb_dev
      - REDIS_URL=redis://redis:6379/1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - LARK_APP_ID=${LARK_APP_ID}
      - LARK_APP_SECRET=${LARK_APP_SECRET}
      - LARK_BASE_APP_TOKEN=${LARK_BASE_APP_TOKEN}
      - LARK_BASE_TABLE_ID=${LARK_BASE_TABLE_ID}
      - LARK_ENCRYPT_KEY=${LARK_ENCRYPT_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_BOT_TOKEN=${TELEGRAM_ADMIN_BOT_TOKEN}
      - TELEGRAM_DRIVER_BOT_TOKEN=${TELEGRAM_DRIVER_BOT_TOKEN}
      - TELEGRAM_ADMIN_GROUP_ID=${TELEGRAM_ADMIN_GROUP_ID}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
    volumes:
      - ./data:/app/data
      - ./core:/app/core
      - ./routers:/app/routers
      - ./services:/app/services
      - ./scripts:/app/scripts
      - ./main.py:/app/main.py
      - ./config.py:/app/config.py
      - ./static:/app/static
      - ./models:/app/models:ro
    networks:
      - default

networks:
  default:
    name: survey-pipeline_default
    external: true
