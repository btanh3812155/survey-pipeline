# Staging topology. Production is provisioned separately under /root/survey-pipeline.
# APP_BUILD_ID, OUTBOX_WORKER_ID and the provider credentials live in the
# target's .env; the release path publishes code only and never edits this file.
services:
  app-dev:
    container_name: survey-dev-app-1
    image: survey-pipeline-app-dev:latest
    working_dir: /app
    restart: unless-stopped
    command: python -m core.server
    environment:
      - ENVIRONMENT=development
      - WEB_CONCURRENCY=1
      - APP_BUILD_ID=${APP_BUILD_ID:?set APP_BUILD_ID to the release build id}
      - DURABLE_WEBRTC_ENABLED=${DURABLE_WEBRTC_ENABLED:-false}
      - DURABLE_LARK_ENABLED=${DURABLE_LARK_ENABLED:-false}
      - DURABLE_MODERATION_ENABLED=${DURABLE_MODERATION_ENABLED:-false}
      - DURABLE_APPEALS_ENABLED=${DURABLE_APPEALS_ENABLED:-false}
      - DURABLE_DRIVE_ENABLED=${DURABLE_DRIVE_ENABLED:-false}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - ADMIN_RECOVERY_EMAIL=${ADMIN_RECOVERY_EMAIL:-admin@trustbridgevn.com}
      - APP_SECRET
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_TLS_MODE=${SMTP_TLS_MODE:-starttls}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-admin@trustbridgevn.com}
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1,::1,caddy}
      - DATABASE_URL=postgresql://postgres:secret_password@postgres:5432/surveydb_dev
      - REDIS_URL=redis://redis:6379/1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - LARK_APP_ID=${LARK_APP_ID}
      - LARK_APP_SECRET=${LARK_APP_SECRET}
      - LARK_BASE_APP_TOKEN=${LARK_BASE_APP_TOKEN}
      - LARK_BASE_TABLE_ID=${LARK_BASE_TABLE_ID}
      - LARK_ENCRYPT_KEY=${LARK_ENCRYPT_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_BOT_TOKEN=${TELEGRAM_ADMIN_BOT_TOKEN}
      - TELEGRAM_DRIVER_BOT_TOKEN=${TELEGRAM_DRIVER_BOT_TOKEN}
      - TELEGRAM_ADMIN_GROUP_ID=${TELEGRAM_ADMIN_GROUP_ID}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_PRIVATE_BUCKET_NAME=${R2_PRIVATE_BUCKET_NAME:-}
      - GOOGLE_DRIVE_ROOT_FOLDER_ID=${GOOGLE_DRIVE_ROOT_FOLDER_ID}
      - GOOGLE_DRIVE_CLIENT_ID=${GOOGLE_DRIVE_CLIENT_ID}
      - GOOGLE_DRIVE_CLIENT_SECRET=${GOOGLE_DRIVE_CLIENT_SECRET}
      - GOOGLE_DRIVE_REFRESH_TOKEN=${GOOGLE_DRIVE_REFRESH_TOKEN}
      - GOOGLE_DRIVE_ACCESS_TOKEN=${GOOGLE_DRIVE_ACCESS_TOKEN}
    volumes:
      - ./data:/app/data
      - ./core:/app/core
      - ./routers:/app/routers
      - ./services:/app/services
      - ./scripts:/app/scripts
      - ./main.py:/app/main.py
      - ./config.py:/app/config.py
      - ./static:/app/static
      - ./models:/app/models:ro
      - ./token.json:/app/token.json:ro
    networks:
      - default

  outbox-v2:
    container_name: survey-dev-outbox-v2-1
    image: survey-pipeline-app-dev:latest
    working_dir: /app
    restart: unless-stopped
    command: ["python", "-m", "workers.outbox_worker"]
    environment:
      - ENVIRONMENT=development
      - APP_BUILD_ID=${APP_BUILD_ID:?set APP_BUILD_ID to the release build id}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - DATABASE_URL=postgresql://postgres:secret_password@postgres:5432/surveydb_dev
      - OUTBOX_WORKER_ID=${OUTBOX_WORKER_ID:?set a stable OUTBOX_WORKER_ID}
      - OUTBOX_V2_WORKER_ENABLED=true
      - DRIVE_SYNC_INTERVAL_SEC=0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_BOT_TOKEN=${TELEGRAM_ADMIN_BOT_TOKEN}
      - TELEGRAM_DRIVER_BOT_TOKEN=${TELEGRAM_DRIVER_BOT_TOKEN}
      - TELEGRAM_ADMIN_GROUP_ID=${TELEGRAM_ADMIN_GROUP_ID}
      - LARK_APP_ID=${LARK_APP_ID}
      - LARK_APP_SECRET=${LARK_APP_SECRET}
      - LARK_BASE_APP_TOKEN=${LARK_BASE_APP_TOKEN}
      - LARK_BASE_TABLE_ID=${LARK_BASE_TABLE_ID}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_PRIVATE_BUCKET_NAME=${R2_PRIVATE_BUCKET_NAME:-}
      - GOOGLE_DRIVE_ROOT_FOLDER_ID=${GOOGLE_DRIVE_ROOT_FOLDER_ID}
      - GOOGLE_DRIVE_CLIENT_ID=${GOOGLE_DRIVE_CLIENT_ID}
      - GOOGLE_DRIVE_CLIENT_SECRET=${GOOGLE_DRIVE_CLIENT_SECRET}
      - GOOGLE_DRIVE_REFRESH_TOKEN=${GOOGLE_DRIVE_REFRESH_TOKEN}
      - GOOGLE_DRIVE_ACCESS_TOKEN=${GOOGLE_DRIVE_ACCESS_TOKEN}
    volumes:
      - ./data:/app/data
      - ./core:/app/core:ro
      - ./services:/app/services:ro
      - ./workers:/app/workers:ro
      - ./scripts:/app/scripts:ro
      - ./config.py:/app/config.py:ro
    healthcheck:
      test: ["CMD", "python", "-m", "workers.outbox_worker", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - default

networks:
  default:
    name: survey-pipeline_default
    external: true
